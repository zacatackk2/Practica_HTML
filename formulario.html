<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Mi Sitio HTML</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="index.html">Login</a></li>
                        <li class="nav-item"><a class="nav-link" href="profile.html">Perfil</a></li>
                        <li class="nav-item"><a class="nav-link" href="tags.html">Etiquetas</a></li>
                        <li class="nav-item"><a class="nav-link active" href="formulario.html">Formulario</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Formulario de contacto</h3>

                        <form>
                            <fieldset class="mb-4">
                                <legend class="col-form-label">Metodo de contacto preferido</legend>

                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="metodoContacto" id="radioEmail" value="email">
                                    <label class="form-check-label" for="radioEmail">Correo electronico</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="metodoContacto" id="radioTelefono" value="telefono">
                                    <label class="form-check-label" for="radioTelefono">Telefono</label>
                                </div>

                                <div id="campoEmail" class="mt-2 d-none">
                                    <label class="form-label">Tu correo electronico:</label>
                                    <input type="email" class="form-control" placeholder="ejemplo@correo.com">
                                </div>
                                <div id="campoTelefono" class="mt-2 d-none">
                                    <label class="form-label">Tu telefono:</label>
                                    <input type="tel" class="form-control" placeholder="10 digitos">
                                </div>

                                <button type="button" id="btnContinuar" class="btn btn-outline-primary mt-3" disabled>Continuar</button>
                            </fieldset>

                            <div class="mb-3">
                                <label class="form-label">Pais:</label>
                                <select class="form-select" id="selectPais">
                                    <option value="">Selecciona un pais</option>
                                </select>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Region:</label>
                                <select class="form-select" id="selectRegion" disabled>
                                    <option value="">Selecciona una region</option>
                                </select>
                            </div>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="chkTerminos">
                                <label class="form-check-label" for="chkTerminos">Acepto los terminos y condiciones</label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="chkDatos">
                                <label class="form-check-label" for="chkDatos">Confirmo que mis datos son correctos</label>
                            </div>

                            <button type="submit" id="btnEnviar" class="btn btn-primary w-100" disabled>Enviar formulario</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
