<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">Test HTML</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="index.html">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="profile.html">Perfil</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="tags.html">Etiquetas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="formulario.html">Formulario</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Iniciar Sesion</h3>
                        <p id="tituloBienvenida" class="text-center">Accede a tu cuenta</p>
                        <p class="aviso text-center">Llena el formulario para continuar</p>
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label">Usuario:</label>
                                <input type="text" class="form-control" id="inputUsuario" name="user" placeholder="Escribe tu usuario">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contrasena:</label>
                                <input type="password" class="form-control" id="inputContrasena" name="pass" placeholder="Escribe tu contrasena">
                            </div>
                            <p id="mensajeError" class="text-danger text-center mb-3 d-none">Usuario o contrasena incorrectos.</p>
                            <button type="submit" class="btn btn-primary w-100">Acceder</button>
                        </form>
                        <p class="text-center text-muted mt-3 mb-0" style="font-size: 0.8rem;">admin / 1234</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
