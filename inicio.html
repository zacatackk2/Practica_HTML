<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="inicio.html">Mi Sitio HTML</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuNavegacion">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" href="inicio.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="profile.html">Perfil</a></li>
                        <li class="nav-item"><a class="nav-link" href="tags.html">Etiquetas</a></li>
                        <li class="nav-item"><a class="nav-link" href="formulario.html">Formulario</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html" id="btnCerrarSesion">Cerrar sesion</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div class="container mt-5 mb-5">
        <div class="card shadow-sm p-4 text-center mb-4">
            <p id="tituloBienvenida"><strong>Sesion iniciada correctamente</strong></p>
            <p id="textoBienvenida">Bienvenido, desde aqui puedes navegar al resto del sitio.</p>
        </div>

        <div class="card shadow-sm p-4 mb-4">
            <h4 id="tituloFormUsuario" class="mb-3">Agregar usuario</h4>
            <form id="formUsuario">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="userName" placeholder="Nombre" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control" id="userAge" placeholder="Edad" required>
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control" id="userPoints" placeholder="Puntos" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" class="form-control" id="userUsername" placeholder="Usuario" required>
                    </div>
                    <div class="col-md-2">
                        <input type="password" class="form-control" id="userPassword" placeholder="Contrasena" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar</button>
                    <button type="button" id="btnCancelar" class="btn btn-secondary d-none">Cancelar</button>
                </div>
            </form>
            <p id="mensajeUsuarios" class="mt-3 mb-0"></p>
        </div>

        <div class="card shadow-sm p-4">
            <h4 class="mb-3">Usuarios</h4>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Puntos</th>
                            <th>Usuario</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
